      </div>
      <button class="btn btn-primary btn-block" onclick="handleLogin()">Log In</button>
    </div>
  </div>
</div>

  <div class="sidebar" id="sidebar"></div>

    <div class="topbar">
      <div>
        <button class="hamburger-btn" onclick="toggleSidebarMobile()" aria-label="Menu"></button>

          <div class="sub" id="topbar-sub"></div>
        </div>

        <button class="btn btn-outline btn-sm theme-toggle-btn-inline" onclick="toggleTheme()" title="Toggle dark mode" style="padding:6px 10px;">
          <span class="theme-toggle-icon"></span>
        </button>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>
